name: Sync Discord Events

on:
  schedule:
    # Runs automatically every hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime via GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Events from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: node scripts/fetch-events.js

      - name: Commit and Push events.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Sync Discord Scheduled Events" && git push)
