<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAHA Event Calendar</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#14B8A6',
              600: '#0D9488',
              700: '#0F766E',
            },
            slate: {
              800: '#1E293B',
              850: '#172132',
              900: '#0F172A',
              950: '#080D1A',
            }
          }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full text-slate-100 font-sans antialiased flex flex-col overflow-hidden bg-slate-900">

  <!-- TOP CONTROL BAR -->
  <header class="bg-slate-950/90 border-b border-slate-800 px-4 py-3 sm:px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-xl bg-brand-500/20 border border-brand-500/30 flex items-center justify-center text-brand-400">
        <i data-lucide="calendar" class="w-4 h-4"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-black text-white tracking-wide uppercase leading-tight">
          FAHA <span class="text-brand-500">Events</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">Community Monthly Calendar</p>
      </div>
    </div>

    <!-- Month Navigation Controls -->
    <div class="flex items-center gap-2">
      <button onclick="changeMonth(-1)" aria-label="Previous Month" class="p-2 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 transition min-h-[40px] min-w-[40px] flex items-center justify-center">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      
      <span id="current-month-label" class="text-xs sm:text-sm font-bold text-white uppercase tracking-wider px-2 min-w-[120px] text-center">
        Loading...
      </span>

      <button onclick="changeMonth(1)" aria-label="Next Month" class="p-2 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 transition min-h-[40px] min-w-[40px] flex items-center justify-center">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>

      <button onclick="goToToday()" class="ml-1 px-3 py-2 text-xs font-semibold bg-brand-600/20 border border-brand-500/30 text-brand-300 hover:bg-brand-600/30 rounded-xl transition">
        Today
      </button>
    </div>
  </header>

  <!-- DAYS OF THE WEEK HEADER -->
  <div class="grid grid-cols-7 bg-slate-950/50 border-b border-slate-800 text-center text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest py-2 shrink-0">
    <div class="text-rose-400">Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div class="text-sky-400">Sat</div>
  </div>

  <!-- MONTHLY GRID CONTAINER -->
  <main class="flex-1 overflow-y-auto no-scrollbar relative p-1 sm:p-2 bg-slate-950">
    <div id="calendar-grid" class="grid grid-cols-7 gap-1 h-full min-h-[500px]">
      <!-- Populated dynamically -->
    </div>
  </main>

  <!-- EVENT DETAILS MODAL -->
  <div id="event-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 text-xs">
      
      <div class="flex items-start justify-between border-b border-slate-800 pb-3">
        <div>
          <span id="modal-event-date" class="text-[10px] font-bold text-brand-400 uppercase tracking-wider block"></span>
          <h3 id="modal-event-title" class="text-base font-black text-white mt-0.5"></h3>
        </div>
        <button onclick="closeEventModal()" aria-label="Close modal" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div class="flex items-start gap-2.5 bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
          <i data-lucide="clock" class="w-4 h-4 text-brand-500 shrink-0 mt-0.5"></i>
          <div>
            <span class="block text-[10px] font-semibold text-slate-400 uppercase">Time</span>
            <span id="modal-event-time" class="text-slate-200 font-medium"></span>
          </div>
        </div>

        <div class="flex items-start gap-2.5 bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
          <i data-lucide="map-pin" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
          <div>
            <span class="block text-[10px] font-semibold text-slate-400 uppercase">Location</span>
            <span id="modal-event-location" class="text-slate-200 font-medium leading-relaxed"></span>
          </div>
        </div>

        <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-800">
          <span class="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Details</span>
          <p id="modal-event-desc" class="text-slate-300 leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>

      <div class="pt-2">
        <button onclick="closeEventModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl transition text-xs">
          Close Details
        </button>
      </div>

    </div>
  </div>

  <script>
    let currentDate = new Date();
    let eventsList = [];

    async function fetchDiscordEvents() {
      try {
        const res = await fetch('events.json');
        if (!res.ok) throw new Error('events.json not found');
        eventsList = await res.json();
      } catch (err) {
        console.warn('Could not load events.json:', err);
        eventsList = [];
      } finally {
        renderCalendar();
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('current-month-label').innerText = `${monthNames[month]} ${year}`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevMonthTotalDays = new Date(year, month, 0).getDate();

      const today = new Date();

      for (let i = firstDayIndex - 1; i >= 0; i--) {
        grid.appendChild(createDayCell(prevMonthTotalDays - i, true));
      }

      for (let day = 1; day <= totalDays; day++) {
        const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        const cell = createDayCell(day, false, isToday);

        const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = eventsList.filter(e => {
          const eDate = new Date(e.startTime);
          const eStr = `${eDate.getFullYear()}-${String(eDate.getMonth() + 1).padStart(2, '0')}-${String(eDate.getDate()).padStart(2, '0')}`;
          return eStr === cellDateStr;
        });

        if (dayEvents.length > 0) {
          const badgeContainer = document.createElement('div');
          badgeContainer.className = 'mt-1 space-y-1 overflow-y-auto max-h-[80px] no-scrollbar';

          dayEvents.forEach(evt => {
            const badge = document.createElement('button');
            badge.onclick = (e) => { e.stopPropagation(); openEventModal(evt); };
            badge.className = 'w-full text-left px-1.5 py-0.5 rounded bg-brand-600/30 border border-brand-500/40 text-brand-200 hover:bg-brand-500/50 transition truncate text-[9px] font-semibold flex items-center gap-1';
            
            badge.innerHTML = `
              <span class="w-1.5 h-1.5 rounded-full bg-brand-400 shrink-0"></span>
              <span class="truncate">${evt.title}</span>
            `;
            badgeContainer.appendChild(badge);
          });

          cell.appendChild(badgeContainer);
        }

        grid.appendChild(cell);
      }

      const totalCellsRendered = firstDayIndex + totalDays;
      const remainingCells = (42 - totalCellsRendered) % 7; 
      for (let day = 1; day <= remainingCells; day++) {
        grid.appendChild(createDayCell(day, true));
      }

      lucide.createIcons();
    }

    function createDayCell(dayNumber, isOtherMonth, isToday = false) {
      const cell = document.createElement('div');
      
      const baseStyles = 'p-1.5 sm:p-2 rounded-xl border flex flex-col justify-between transition min-h-[70px] sm:min-h-[90px]';
      const monthStyles = isOtherMonth 
        ? 'bg-slate-900/30 border-slate-900/50 text-slate-600' 
        : 'bg-slate-850/80 border-slate-800/80 text-slate-200 hover:border-slate-700';
      const todayStyles = isToday ? 'ring-2 ring-brand-500 bg-slate-800' : '';

      cell.className = `${baseStyles} ${monthStyles} ${todayStyles}`;

      cell.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold ${isToday ? 'text-brand-400 font-extrabold' : ''}">${dayNumber}</span>
          ${isToday ? '<span class="text-[8px] uppercase font-bold text-brand-400 bg-brand-500/20 px-1 rounded">Today</span>' : ''}
        </div>
      `;

      return cell;
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function openEventModal(evt) {
      const start = new Date(evt.startTime);
      const end = evt.endTime ? new Date(evt.endTime) : null;

      document.getElementById('modal-event-date').innerText = start.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('modal-event-title').innerText = evt.title;
      
      const timeOpts = { hour: 'numeric', minute: '2-digit' };
      const timeString = end 
        ? `${start.toLocaleTimeString([], timeOpts)} - ${end.toLocaleTimeString([], timeOpts)}`
        : start.toLocaleTimeString([], timeOpts);

      document.getElementById('modal-event-time').innerText = timeString;
      document.getElementById('modal-event-location').innerText = evt.location || 'Location provided in Discord announcement';
      document.getElementById('modal-event-desc').innerText = evt.description || 'No additional details provided.';

      document.getElementById('event-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeEventModal() {
      document.getElementById('event-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchDiscordEvents();
    });
  </script>
</body>
</html>
